
<svg width="500" height="215" viewBox="0 0 500 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="descId">
  <title id="titleId">atharvpawar16's LeetCode Stats</title>
  <desc id="descId">LeetCode Statistics: 0 problems solved</desc>
  
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #B87333;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    @supports(-moz-appearance: auto) {
      .header { font-size: 15.5px; }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
    }
    .stat-bold {
      font: 700 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
    }
    .stat-label {
      font: 400 12px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
      opacity: 0.7;
    }
    .circle-text {
      font: 600 16px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
      text-anchor: middle;
    }
    .circle-number {
      font: 700 32px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #B87333;
      text-anchor: middle;
    }
    .circle-percentage {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #B87333;
      text-anchor: middle;
    }
    .rank-text {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
      text-anchor: middle;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    .progress-bar {
      transform-origin: left;
      transform: scaleX(0);
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    .lang-name {
      font: 400 11px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
      fill: #434d58;
    }
    
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
        transform: translateX(-5px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    
    @keyframes growWidthAnimation {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }
    
    @keyframes scaleInAnimation {
      from {
        transform: scale(0) rotate(45deg);
      }
      to {
        transform: scale(1) rotate(0deg);
      }
    }
  </style>
  
  <!-- Enhanced background with subtle gradient -->
  <defs>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffefe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fffefe;stop-opacity:0.98" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect data-testid="card-bg" x="0.5" y="0.5" rx="4.5" 
        height="214" width="499" 
        fill="url(#cardGradient)" 
        stroke="#e4e2e2" 
        stroke-width="1"
        stroke-opacity="1"
        filter="url(#dropShadow)"/>
  
  <!-- Header section with improved layout -->
  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header">atharvpawar16's LeetCode Stats</text>
    
    <g transform="translate(330, -5)">
      <rect x="0" y="-15" width="140" height="25" rx="12" fill="#ff6b6b" opacity="0.1"/>
      <text x="70" y="2" class="rank-text" fill="#ff6b6b">
        Rank: 5,000,001
      </text>
    </g>
  </g>

  <g data-testid="main-card-body" transform="translate(25, 55)">
    
    <!-- Enhanced central circle progress indicator -->
    <g transform="translate(65, 55)">
      <!-- Outer glow -->
      <circle cx="0" cy="0" r="55" fill="none" stroke="#B87333" stroke-width="1" opacity="0.06"/>
      <!-- Background ring -->
      <circle cx="0" cy="0" r="50" fill="none" stroke="#e4e2e2" stroke-width="4" opacity="0.15"/>
      <!-- Progress arc drawn as a path that starts at top (12 o'clock) -->
      <!-- Path: move to (0,-r) then draw two half-arcs to make a full circle -->
      <path
        d="M 0 -50 a 50 50 0 1 1 0 100 a 50 50 0 1 1 0 -100"
        fill="none"
        stroke="#B87333"
        stroke-width="8"
        stroke-linecap="round"
        stroke-dasharray="314.1592653589793"
        stroke-dashoffset="314.159"
        class="stagger"
        style="filter: drop-shadow(0 0 6px #B8733325);"
      >
        <animate
          attributeName="stroke-dashoffset"
          from="314.159"
          to="314.159"
          begin="0.06s"
          dur="0.9s"
          fill="freeze"
        />
      </path>

      <!-- Center numbers -->
      <text x="0" y="-2" class="circle-number">0</text>
      <text x="0" y="16" class="circle-text">Solved</text>
      <text x="0" y="32" class="circle-percentage">0.0%</text>
    </g>
    
    <!-- Enhanced right side statistics with better spacing and repositioned percentages -->
    <g transform="translate(140, 10)">
      <!-- Easy problems with enhanced styling -->
      <g class="stagger" style="animation-delay: 600ms">
        <text x="0" y="18" class="stat">Easy</text>
        <text x="270" y="18" class="stat-bold" text-anchor="end">0/972</text>
        <text x="320" y="18" class="stat-label" text-anchor="end">0.0%</text>
        
  <rect x="0" y="25" width="320" height="8" rx="4" fill="#e4e2e2" opacity="0.2"/>
  <rect x="0" y="25" width="0" height="8" rx="4" fill="#00b894" class="progress-bar" style="animation-delay: 800ms"/>
      </g>
      
      <!-- Medium problems -->
      <g class="stagger" style="animation-delay: 700ms">
        <text x="0" y="55" class="stat">Medium</text>
        <text x="270" y="55" class="stat-bold" text-anchor="end">0/2131</text>
        <text x="320" y="55" class="stat-label" text-anchor="end">0.0%</text>
        
      <rect x="0" y="62" width="320" height="8" rx="4" fill="#e4e2e2" opacity="0.2"/>
      <rect x="0" y="62" width="0" height="8" rx="4" fill="#fdcb6e" class="progress-bar" style="animation-delay: 900ms"/>
      </g>
      
      <!-- Hard problems -->
      <g class="stagger" style="animation-delay: 800ms">
        <text x="0" y="92" class="stat">Hard</text>
        <text x="270" y="92" class="stat-bold" text-anchor="end">0/984</text>
        <text x="320" y="92" class="stat-label" text-anchor="end">0.0%</text>
      <rect x="0" y="99" width="320" height="8" rx="4" fill="#e4e2e2" opacity="0.2"/>
      <rect x="0" y="99" width="0" height="8" rx="4" fill="#e17055" class="progress-bar" style="animation-delay: 1000ms"/>
      </g>
    </g>
  </g>

  

  
</svg>