<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Atharv Pawar, full-stack developer. I build things that stay live.">
<style>
.bg{fill:#f6f3ec;stroke:#e2ddd0;stroke-width:1}
.t{font-family:Georgia,'Times New Roman',serif;fill:#1c1b19}
.s{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#5c5850;letter-spacing:3px}
.i{font-family:Georgia,'Times New Roman',serif;font-style:italic;fill:#5c5850}
.live{fill:#b4521f}
.base{stroke:#d9d3c4;stroke-width:1}
.l{fill:none;stroke:#b4521f;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1200;stroke-dashoffset:0;animation:draw 5.5s linear infinite}
@keyframes draw{
0%{stroke-dashoffset:1200;opacity:1}
60%{stroke-dashoffset:0;opacity:1}
85%{stroke-dashoffset:0;opacity:1}
92%{stroke-dashoffset:0;opacity:0}
92.1%{stroke-dashoffset:1200;opacity:0}
100%{stroke-dashoffset:1200;opacity:1}
}
.dot{fill:#b4521f;animation:dot 5.5s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes dot{
0%,55%{opacity:0;transform:scale(1)}
60%{opacity:1;transform:scale(1)}
70%{opacity:1;transform:scale(1.9)}
85%{opacity:1;transform:scale(1)}
92%,100%{opacity:0;transform:scale(1)}
}
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="219" rx="14"/>
<text class="s" x="48" y="62" font-size="13">FULL-STACK DEVELOPER · INDIA</text>
<text class="t" x="48" y="122" font-size="54">Atharv Pawar</text>
<text class="i" x="50" y="156" font-size="18">I build things that stay <tspan class="live">live.</tspan></text>
<path class="base" d="M0 190H900"/>
<path class="l" d="M48 190H380L400 190 420 160 446 206 472 172 492 190H640L656 190 676 166 698 200 716 190H852"/>
<circle class="dot" cx="852" cy="190" r="4"/>
</svg>
