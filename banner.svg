<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="Atharv Pawar, full-stack developer, India">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1a3d"/><stop offset="1" stop-color="#08102a"/></linearGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e8935a" stop-opacity=".22"/><stop offset="1" stop-color="#e8935a" stop-opacity="0"/></radialGradient>
<linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8935a" stop-opacity="0"/><stop offset=".25" stop-color="#e8935a" stop-opacity="1"/><stop offset="1" stop-color="#e8935a" stop-opacity="1"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#f3eee2" stroke-opacity=".04" stroke-width="1"/></pattern>
<clipPath id="r"><rect width="1000" height="320" rx="16"/></clipPath>
</defs>
<style>
.serif{font-family:Georgia,'Times New Roman',serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.pl{fill:none;stroke:url(#fadeL);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;animation:run 6s ease-in-out -3.6s infinite}
@keyframes run{0%{stroke-dashoffset:900}55%{stroke-dashoffset:0}85%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:.35}}
.g{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-36px,22px)}}
.ping{transform-box:fill-box;transform-origin:center;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(4.2);opacity:0}}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
</style>
<g clip-path="url(#r)">
<rect width="1000" height="320" fill="url(#bg)"/>
<rect width="1000" height="320" fill="url(#grid)"/>
<g class="g"><circle cx="800" cy="120" r="230" fill="url(#glow)"/></g>
<rect x="0" y="0" width="6" height="320" fill="#e8935a"/>

<text class="mono" x="56" y="78" font-size="13" letter-spacing="4" fill="#a3acc4">FULL-STACK DEVELOPER</text>
<rect x="56" y="90" width="44" height="2" fill="#e8935a"/>
<text class="serif" x="54" y="168" font-size="76" fill="#f3eee2" letter-spacing="-1.5">Atharv Pawar</text>
<text class="serif" x="57" y="206" font-size="23" font-style="italic" fill="#e8935a">I build things that stay live.</text>

<path d="M520 150H1000" stroke="#f3eee2" stroke-opacity=".12" stroke-width="1"/>
<path class="pl" d="M520 150H640L664 150 686 104 716 196 744 124 766 150H850L870 150 892 112 918 182 938 150H1000"/>
<circle cx="766" cy="150" r="4.5" fill="#e8935a"/>
<circle class="ping" cx="766" cy="150" r="4.5" fill="none" stroke="#e8935a" stroke-width="1.5"/>

<path d="M56 246H944" stroke="#f3eee2" stroke-opacity=".14" stroke-width="1"/>
<text class="mono" x="56" y="276" font-size="13" letter-spacing="1.5" fill="#f3eee2" fill-opacity=".86">C#  ·  .NET  ·  JavaScript  ·  TypeScript  ·  Java  ·  Next.js  ·  Node.js  ·  Firebase  ·  PostgreSQL</text>
<text class="mono" x="944" y="78" font-size="13" letter-spacing="3" fill="#a3acc4" text-anchor="end">INDIA</text>
</g>
<rect x=".5" y=".5" width="999" height="319" rx="16" fill="none" stroke="#f3eee2" stroke-opacity=".1"/>
</svg>
