name: Metrics
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34 pinned
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: atharvpawar16
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Calcutta
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
      - name: Recolor metrics SVG to profile palette
        run: |
          git pull --rebase origin main
          sed -i \
            -e 's/#0366d6/#B87333/g' \
            -e 's/#ebedf0/#EFE6DC/g' \
            -e 's/#9be9a8/#E4C9A9/g' \
            -e 's/#40c463/#D9A05B/g' \
            -e 's/#30a14e/#B87333/g' \
            -e 's/#216e39/#6B4A1F/g' \
            github-metrics.svg
          if ! git diff --quiet github-metrics.svg; then
            git config user.name "Atharv Pawar"
            git config user.email "adp060606@gmail.com"
            git add github-metrics.svg
            git commit -m "Recolor metrics SVG to profile palette [skip ci]"
            git push origin main
          fi
      - name: Fetch and recolor LeetCode stats card
        run: |
          git pull --rebase origin main
          curl -fsSL "https://github-readme-leetcode-card.romitsagu.com/atharvpawar16" -o leetcode.svg
          sed -i -e 's/#4c71f2/#B87333/g' -e 's/#2f80ed/#B87333/g' leetcode.svg
          git config user.name "Atharv Pawar"
          git config user.email "adp060606@gmail.com"
          git add leetcode.svg
          if ! git diff --cached --quiet leetcode.svg; then
            git commit -m "Update LeetCode stats card [skip ci]"
            git push origin main
          fi
