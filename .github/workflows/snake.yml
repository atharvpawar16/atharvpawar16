name: Generate contribution snake
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: atharvpawar16
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23B87333&color_dots=%23EFE6DC,%23E4C9A9,%23D9A05B,%23B87333,%236B4A1F
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
