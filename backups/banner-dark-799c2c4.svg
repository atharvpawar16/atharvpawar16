<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Atharv Pawar, full-stack developer">
<style>
.bg{fill:#0b0d12}
.t{font-family:Georgia,'Times New Roman',serif;fill:#f1ede4}
.s{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#9aa0ae;letter-spacing:3px}
.l{fill:none;stroke:#5b8cff;stroke-width:2;stroke-linecap:round;stroke-dasharray:1200;animation:d 3.4s .4s ease-out backwards}
.base{stroke:#222733;stroke-width:1}
